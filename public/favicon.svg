<svg xmlns="http://www.w3.org/2000/svg" viewBox="74 71 352 352" width="32" height="32" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="EtAlii ADP">
  <!-- The site favicon: the ADP mark "two perspectives" (version 3) from etalii-adp/etalii.adp media/icons, "dark-green" with the upper plate dark grey, and "white-green" with it white when the browser is in dark mode. -->
  <style>
    .top-stroke { stroke: #24292f; }
    .top-fill { fill: #24292f; }
    @media (prefers-color-scheme: dark) {
      .top-stroke { stroke: #ffffff; }
      .top-fill { fill: #ffffff; }
    }
  </style>
  <defs>
    <!-- Hides the lower plate and projection lines where the upper plate sits, with a small gap. -->
    <mask id="under" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="500">
      <rect width="500" height="500" fill="#fff"/>
      <rect transform="matrix(0.866 0.5 -0.866 0.5 250 168)" x="-85" y="-85" width="170" height="170" rx="14" fill="#000" stroke="#000" stroke-width="30"/>
    </mask>
    <!-- Cuts the text lines out of the lower plate. -->
    <mask id="text" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="500">
      <rect width="500" height="500" fill="#fff"/>
      <g transform="matrix(0.866 0.5 -0.866 0.5 250 332)" stroke="#000" stroke-width="12">
        <path d="M-58 -52h90M-58 -22h116M-38 8h70M-38 38h96M-58 62h50"/>
      </g>
    </mask>
  </defs>
  <!-- One model, two perspectives: text below in green, the same thing as a diagram above in dark grey, for light backgrounds. -->
  <g mask="url(#under)">
    <g mask="url(#text)">
      <rect transform="matrix(0.866 0.5 -0.866 0.5 250 332)" x="-85" y="-85" width="170" height="170" rx="14" fill="#008200" stroke="#008200" stroke-width="8"/>
    </g>
    <path d="M186 196v96M314 196v96" stroke="#008200" stroke-width="5" stroke-dasharray="4 14"/>
  </g>
  <g transform="matrix(0.866 0.5 -0.866 0.5 250 168)">
    <rect x="-85" y="-85" width="170" height="170" rx="14" class="top-stroke" stroke-width="12"/>
    <path d="M-45 -45 40 -40M-45 -45 -40 40M40 -40 45 45M-40 40 45 45" class="top-stroke" stroke-width="9"/>
    <g class="top-fill">
      <circle cx="-45" cy="-45" r="18"/><circle cx="40" cy="-40" r="14"/>
      <circle cx="-40" cy="40" r="14"/><circle cx="45" cy="45" r="18"/>
    </g>
  </g>
</svg>
