# Publishes develop to GitHub Pages at https://etalii.net (FR-011). It publishes the site that the Build workflow
# built and checked for develop's head, so the site is never published without passing every check, and never
# checked twice: if Build fails, nothing is uploaded and the published site stays as it was (FR-013).
#
# One run publishes both the site, at /adp, and the Notion add-ons of etalii.adp.ide.notion, at /adp-notion
# (etalii.adp spec 011-notion-repository, contracts/publication.md). A Pages deployment replaces the whole
# domain, so the add-ons are built into dist beside the site and uploaded in the same artifact. A merge into
# develop of etalii.adp.ide.notion starts this workflow through workflow_dispatch; it then republishes the site
# Build checked for develop's head with the add-ons of that moment.
#
# The same run adds the hosted experiment of etalii.adp (its hosts/_experiments/hosted) at /adp/experiment/hosting,
# as it is on etalii.adp's develop at that moment, and puts the experiment's start page at /adp as well (Peter,
# 2026-11-27). The site's own start page is /adp/about/.
name: deploy

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      # Only develop's head is published. A Build of an older commit leaves it to the Build of the newer one; a
      # dispatch while the head's Build is still running leaves it to that Build, which takes the add-ons as they
      # are when it finishes.
      - name: Find the checked site of develop's head
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/$REPO/commits/develop" --jq .sha)
          if [ "$EVENT" = workflow_run ]; then
            if [ "$RUN_SHA" != "$head" ]; then
              echo "::notice::Build checked $RUN_SHA, but develop is at $head now; its Build publishes."
              exit 0
            fi
            run=$RUN_ID
          else
            run=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?branch=develop&event=push&head_sha=$head&status=success" --jq '.workflow_runs[0].id // empty')
            if [ -z "$run" ]; then
              echo "::notice::Build has not passed for develop's head $head; its Build publishes once it passes."
              exit 0
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - if: steps.find.outputs.run != ''
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}

      # The checkout needs no token: the repository is public.
      - if: steps.find.outputs.run != ''
        name: Check out the Notion add-ons
        uses: actions/checkout@v7
        with:
          repository: etalii-adp/etalii.adp.ide.notion
          ref: develop
          path: .notion-addons
      - if: steps.find.outputs.run != ''
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - if: steps.find.outputs.run != ''
        name: Build the Notion add-ons
        working-directory: .notion-addons
        run: node scripts/build.mjs --out "$GITHUB_WORKSPACE/dist/adp-notion"
      # The hosted experiment of etalii.adp (hosts/_experiments/hosted): pages written in TypeScript, checked and
      # built here by that folder's own npm run check, and published from its dist at /adp/experiment/hosting. The
      # first line of the copy fails the run if the site itself ever grows a page at /adp/experiment.
      - if: steps.find.outputs.run != ''
        name: Check out the hosted experiment
        uses: actions/checkout@v7
        with:
          repository: etalii-adp/etalii.adp
          ref: develop
          path: .adp
          sparse-checkout: hosts/_experiments/hosted
      - if: steps.find.outputs.run != ''
        name: Build the hosted experiment
        working-directory: .adp/hosts/_experiments/hosted
        run: |
          npm ci
          npm run check
      - if: steps.find.outputs.run != ''
        name: Add the hosted experiment
        run: |
          test ! -e dist/adp/experiment
          mkdir -p dist/adp/experiment
          cp -R .adp/hosts/_experiments/hosted/dist dist/adp/experiment/hosting
      # The experiment's start page is the page at /adp too: a copy of its index.html with a <base> that points at
      # /adp/experiment/hosting/, so its style sheets, its script and its links resolve there. It takes the place of
      # the page the site builds at /adp/, which only redirects to /adp/about/; the first line fails the run if that
      # ever becomes a page of its own.
      - if: steps.find.outputs.run != ''
        name: Put the start page of the hosted experiment at /adp
        run: |
          grep -q 'http-equiv="refresh"' dist/adp/index.html
          sed 's|<head>|<head>\n<base href="/adp/experiment/hosting/">|' dist/adp/experiment/hosting/index.html > dist/adp/index.html
          grep -q '<base href="/adp/experiment/hosting/">' dist/adp/index.html
      - if: steps.find.outputs.run != ''
        name: Check the site, the add-on index and the hosted experiment are there
        run: test -f dist/index.html && test -f dist/adp/index.html && test -f dist/adp/about/index.html && test -f dist/adp-notion/index.html && test -f dist/adp/experiment/hosting/index.html
      - if: steps.find.outputs.run != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.run != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
