# Publishes develop to GitHub Pages at https://etalii.net (FR-011). The site is built and checked first;
# if any step fails, nothing is uploaded and the published site stays as it was (FR-013).
#
# One run publishes both the site, at /adp, and the Notion add-ons of etalii.adp.ide.notion, at /adp-notion
# (etalii.adp spec 011-notion-repository, contracts/publication.md). A Pages deployment replaces the whole
# domain, so the add-ons are built into dist beside the site and uploaded in the same artifact. A merge into
# develop of etalii.adp.ide.notion starts this workflow through workflow_dispatch.
name: deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium serves the page checks and the build-time Mermaid rendering of the DISL and DID reference
      # (spec 002 research D10); the browser download is cached between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - run: npm run build
      - run: npm run check:reference
      - run: npm run check
      # The site's checks have run by now, so they never read an add-on. The checkout needs no token:
      # the repository is public.
      - name: Check out the Notion add-ons
        uses: actions/checkout@v7
        with:
          repository: etalii-adp/etalii.adp.ide.notion
          ref: develop
          path: .notion-addons
      - name: Build the Notion add-ons
        working-directory: .notion-addons
        run: node scripts/build.mjs --out "$GITHUB_WORKSPACE/dist/adp-notion"
      - name: Check the add-on index was built
        run: test -f dist/adp-notion/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
