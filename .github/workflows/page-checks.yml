# The page checks of a built site: `npm run check:pages` of the site Build built, in shards, and the DISL and DID
# references built from their pinned fixture. Build calls this workflow for every pull request, so a pull request
# merges only once they pass (its `complete` job waits for them).
#
# On develop they run AFTER Build rather than inside it, beside deploy: Build on a push to develop is the build and
# the checks that need no browser, deploy publishes as soon as that passes, and this workflow checks the same built
# site while it goes live (CI speed analysis, 2026-10-12: merge to live went from about 9 to about 3 minutes). The
# pull request already passed these checks; a failure here means two merges combined into a page that fails one,
# and it shows as a red run of this workflow on develop rather than as a site that was not published.
name: page-checks

on:
  workflow_call:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  actions: read

jobs:
  # The page checks (npm run check:pages) of the site Build built, split over four runners. Which test lands on which
  # shard follows the order tests/site.spec.ts gives its pages, which spreads the slow ones over every shard.
  pages:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The site Build built: this run's own when Build calls this workflow, the finished Build's on develop.
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.event.workflow_run.id && github.token || '' }}
      - run: npm run check:pages -- --shard=${{ matrix.shard }}/4

  # The DISL and DID references (spec 002) built from their pinned test fixture, so that their pages are checked
  # before a licensed snapshot exists. This build is never published; its licence check reports a warning, not a failure.
  # Only the reference pages of that build are checked in a browser (CHECK_PAGES_ONLY): every other page of it is
  # the same page the pages job checks in the real build.
  reference-fixture:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      REFERENCE_CONTENT_DIR: tests/reference/fixtures/disl-c2623d4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:reference
      - run: npm run check:links
      - run: npm run check:catalogue
      - run: npm run check:pages -- tests/site.spec.ts
        env:
          CHECK_PAGES_ONLY: '^/adp/(?:disl|did)/'
      # Two versions (quickstart 4): banners on the older one, latest addresses and stubs.
      - run: npm run build:versioning-test
      - run: npm run check:reference
        env:
          REFERENCE_CONTENT_DIR: tests/reference/fixtures/.generated/disl-versioning
      # DEDL moved to DISL and DID (etalii.adp spec 002): built from the DEDL 0.1 fixture, every former DEDL page
      # redirects to /adp/disl/ in one hop, and DEDL 0.1's schema is still served at its own address.
      - run: npm run build
        env:
          REFERENCE_CONTENT_DIR: tests/reference/fixtures/dedl-aaef333
      - run: npm run check:moved
        env:
          REFERENCE_CONTENT_DIR: tests/reference/fixtures/dedl-aaef333
