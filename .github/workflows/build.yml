# The site's Build workflow (etalii.adp spec 001-ci-and-badges). It runs on every pull request into develop and
# on every change to develop, and its badge stands for this repository. It checks that the unit tests pass, the
# site builds, the DISL and DID references pass check:reference, its internal links resolve and every page passes the
# accessibility, phone-width, no-script and privacy checks (FR-012). It has no Pages permissions, so it never
# changes the published site (FR-011); deploy.yml publishes.
name: Build

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium serves the page checks and the build-time Mermaid rendering of the DISL and DID references
      # (spec 002 research D10); the browser download is cached between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - run: npm run test:catalogue
      - run: npm run build
      - run: npm run check:reference
      - run: npm run check

  # The DISL and DID references (spec 002) built from their pinned test fixture, so that their pages are checked
  # before a licensed snapshot exists. This build is never published; its licence check reports a warning, not a failure.
  reference-fixture:
    runs-on: ubuntu-latest
    env:
      REFERENCE_CONTENT_DIR: tests/reference/fixtures/disl-c2623d4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:reference
      - run: npm run check
      # Two versions (quickstart 4): banners on the older one, latest addresses and stubs.
      - run: npm run build:versioning-test
      - run: npm run check:reference
        env:
          REFERENCE_CONTENT_DIR: tests/reference/fixtures/.generated/disl-versioning
      # DEDL moved to DISL and DID (etalii.adp spec 002): built from the DEDL 0.1 fixture, every former DEDL page
      # redirects to /adp/disl/ in one hop, and DEDL 0.1's schema is still served at its own address.
      - run: npm run build
        env:
          REFERENCE_CONTENT_DIR: tests/reference/fixtures/dedl-aaef333
      - run: npm run check:moved
        env:
          REFERENCE_CONTENT_DIR: tests/reference/fixtures/dedl-aaef333

  # Flags a retired use of the ADP vocabulary (etalii.adp spec 002, FR-017). The runner and its list of retired
  # patterns and allowances live in etalii.adp and are read from its develop branch, so every repository is checked
  # against the same list.
  terminology:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the vocabulary against the glossary
        env:
          SOURCE: https://raw.githubusercontent.com/etalii-adp/etalii.adp/develop
        run: |
          curl -fsSL "$SOURCE/.github/scripts/terminology-check.py" -o "$RUNNER_TEMP/terminology-check.py"
          python "$RUNNER_TEMP/terminology-check.py" --name "${{ github.event.repository.name }}" --config "$SOURCE/docs/terminology-check.json"
